<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Via — Aesthetic Blueprint</title>
  <meta name="description" content="Aesthetic Blueprint by Via — Looks. Presence. Structure." />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cinzel+Decorative:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #050405;
      --bg-card: #0e0a0c;
      --rose: #6b1525;
      --rose-bright: #9b1e32;
      --rose-deep: #3d0c16;
      --silver: #c8c2b8;
      --silver-bright: #e8e4dc;
      --muted: #8a8178;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--silver);
      font-family: 'Cormorant Garamond', Georgia, serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 20px 70px;
      position: relative;
      overflow-x: hidden;
    }

    /* smoky vignette */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(107,21,37,0.18) 0%, transparent 55%),
        radial-gradient(ellipse at 50% 100%, rgba(0,0,0,0.7) 0%, transparent 50%),
        radial-gradient(ellipse at 20% 40%, rgba(61,12,22,0.25) 0%, transparent 40%),
        radial-gradient(ellipse at 80% 60%, rgba(61,12,22,0.2) 0%, transparent 40%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Top VIA */
    .via-top {
      font-family: 'Cinzel', serif;
      font-size: 0.85rem;
      letter-spacing: 0.55em;
      text-transform: uppercase;
      color: var(--silver);
      margin-bottom: 18px;
      opacity: 0.9;
    }
    .via-top span {
      opacity: 0.5;
      letter-spacing: 0.2em;
    }

    /* Main title */
    h1 {
      font-family: 'Cinzel', serif;
      font-weight: 600;
      font-size: 1.85rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-align: center;
      line-height: 1.15;
      color: var(--silver-bright);
      text-shadow:
        0 1px 0 #2a2520,
        0 2px 8px rgba(0,0,0,0.8),
        0 0 40px rgba(200,194,184,0.15);
      margin-bottom: 6px;
    }

    h1 .line2 {
      display: block;
      font-size: 1.95rem;
      letter-spacing: 0.08em;
    }

    /* Divider with shield feel */
    .ornament {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0 18px;
      width: 100%;
      max-width: 260px;
    }
    .ornament-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, #5a4a42, transparent);
    }
    .ornament-center {
      width: 8px;
      height: 8px;
      border: 1px solid #7a6a60;
      transform: rotate(45deg);
      background: #1a1214;
    }

    /* Pillars line */
    .pillars {
      font-family: 'Cinzel', serif;
      font-size: 0.72rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 32px;
      text-align: center;
    }

    /* Shield-style avatar */
    .shield {
      width: 92px;
      height: 108px;
      margin-bottom: 28px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .shield-inner {
      width: 78px;
      height: 92px;
      background: linear-gradient(160deg, #1a1216 0%, #0c080a 100%);
      border: 1.5px solid #4a3a35;
      clip-path: polygon(50% 0%, 100% 12%, 100% 70%, 50% 100%, 0% 70%, 0% 12%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        0 0 0 1px rgba(0,0,0,0.8),
        0 8px 24px rgba(0,0,0,0.6),
        inset 0 1px 0 rgba(200,194,184,0.08);
    }
    .shield-rose {
      font-size: 2.1rem;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6));
    }

    /* Links */
    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .link-btn {
      display: block;
      text-decoration: none;
      text-align: center;
      padding: 17px 20px;
      position: relative;
      transition: all 0.25s ease;
      background: linear-gradient(180deg, #141014 0%, #0c090b 100%);
      border: 1px solid #3a2a28;
      color: var(--silver);
      font-family: 'Cinzel', serif;
      letter-spacing: 0.08em;
    }

    .link-btn.primary {
      border-color: #5c1e28;
      background: linear-gradient(160deg, #1a0c10 0%, #12080c 50%, #1a0c10 100%);
      box-shadow:
        0 0 0 1px rgba(107,21,37,0.25),
        0 6px 20px rgba(0,0,0,0.5),
        inset 0 1px 0 rgba(155,30,50,0.08);
    }

    .link-btn.primary:hover {
      border-color: var(--rose-bright);
      transform: translateY(-1px);
      box-shadow:
        0 0 0 1px rgba(155,30,50,0.35),
        0 10px 28px rgba(107,21,37,0.25),
        inset 0 1px 0 rgba(155,30,50,0.12);
    }

    .link-btn.secondary {
      border-color: #2e2420;
    }
    .link-btn.secondary:hover {
      border-color: #5a4a42;
      background: #161214;
    }

    .btn-title {
      display: block;
      font-weight: 600;
      font-size: 0.95rem;
      margin-bottom: 3px;
      color: var(--silver-bright);
    }

    .btn-sub {
      display: block;
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.9rem;
      letter-spacing: 0.03em;
      color: var(--muted);
      font-weight: 400;
    }

    .price-tag {
      display: inline-block;
      margin-top: 7px;
      padding: 2px 11px;
      border: 1px solid rgba(155,30,50,0.45);
      font-size: 0.78rem;
      letter-spacing: 0.12em;
      color: #c45a6a;
      background: rgba(107,21,37,0.15);
    }

    /* Socials */
    .socials {
      display: flex;
      gap: 14px;
      margin-top: 36px;
    }

    .social-link {
      width: 42px;
      height: 42px;
      border: 1px solid #2e2420;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      text-decoration: none;
      transition: all 0.25s ease;
      background: #0e0a0c;
    }

    .social-link:hover {
      border-color: #5a4a42;
      color: var(--silver);
    }

    .social-link svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    footer {
      margin-top: 48px;
      font-family: 'Cinzel', serif;
      font-size: 0.7rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: #4a3f38;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="via-top"><span>•</span> VIA <span>•</span></div>

    <h1>
      Aesthetic
      <span class="line2">Blueprint</span>
    </h1>

    <div class="ornament">
      <div class="ornament-line"></div>
      <div class="ornament-center"></div>
      <div class="ornament-line"></div>
    </div>

    <div class="pillars">Looks • Presence • Structure</div>

    <!-- Shield -->
    <div class="shield">
      <div class="shield-inner">
        <div class="shield-rose">🌹</div>
      </div>
    </div>

    <div class="links">
      <a href="#REPLACE-WITH-YOUR-CHECKOUT-LINK" class="link-btn primary">
        <span class="btn-title">Aesthetic Blueprint</span>

        <span class="price-tag">$35</span>
      </a>

      <a href="https://www.instagram.com/viakhn/?hl=en" class="link-btn secondary" target="_blank" rel="noopener">
        <span class="btn-title">Instagram</span>
        <span class="btn-sub">@viakhn</span>
      </a>
    </div>

    <div class="socials">
      <a href="https://www.instagram.com/viakhn/?hl=en" class="social-link" aria-label="Instagram" target="_blank" rel="noopener">

    </div>

    <footer>Via</footer>

    document.querySelectorAll('a[href^="#REPLACE"]').forEach(link => {

  </script>
</body>
</html>
