<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Via — Beauty Blueprint</title>
  <meta name="description" content="Beauty Blueprint by Via — a $35 medieval-inspired guide to luminous skin, soft power, and sacred beauty rituals." />
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Great+Vibes&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-deep: #0c0809;
      --bg-card: #160f12;
      --rose-dark: #5c1a2a;
      --rose: #8b2e3f;
      --rose-light: #b84a5e;
      --gold: #c9a227;
      --gold-soft: #e8d5a3;
      --cream: #f5efe6;
      --text-muted: #c4b5b0;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: var(--bg-deep);
      color: var(--cream);
      font-family: 'Cormorant Garamond', Georgia, serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 40px 20px 60px;
      position: relative;
      overflow-x: hidden;
    }

    /* Subtle rose pattern overlay */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: 
        radial-gradient(ellipse at 20% 30%, rgba(139, 46, 63, 0.12) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 70%, rgba(92, 26, 42, 0.15) 0%, transparent 45%),
        radial-gradient(ellipse at 50% 10%, rgba(201, 162, 39, 0.05) 0%, transparent 40%);
      pointer-events: none;
      z-index: 0;
    }

    /* Decorative corner roses (CSS) */
    .corner-rose {
      position: fixed;
      width: 120px;
      height: 120px;
      opacity: 0.18;
      pointer-events: none;
      z-index: 0;
    }
    .corner-rose.top-left {
      top: -20px;
      left: -20px;
      transform: rotate(-15deg);
    }
    .corner-rose.bottom-right {
      bottom: -30px;
      right: -20px;
      transform: rotate(160deg);
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Avatar */
    .avatar-wrap {
      width: 118px;
      height: 118px;
      border-radius: 50%;
      padding: 4px;
      background: linear-gradient(145deg, var(--gold), var(--rose), var(--gold-soft));
      margin-bottom: 22px;
      box-shadow: 0 0 30px rgba(139, 46, 63, 0.35);
    }

    .avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: var(--bg-card);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Great Vibes', cursive;
      font-size: 52px;
      color: var(--gold-soft);
      border: 3px solid var(--bg-deep);
    }

    /* Name & tagline */
    h1 {
      font-family: 'Cinzel', serif;
      font-weight: 600;
      font-size: 2.35rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--cream);
      margin-bottom: 6px;
      text-shadow: 0 2px 12px rgba(0,0,0,0.5);
    }

    .tagline {
      font-family: 'Great Vibes', cursive;
      font-size: 1.55rem;
      color: var(--gold);
      margin-bottom: 18px;
      letter-spacing: 0.03em;
    }

    .bio {
      text-align: center;
      font-size: 1.15rem;
      line-height: 1.55;
      color: var(--text-muted);
      max-width: 340px;
      margin-bottom: 32px;
      font-weight: 400;
    }

    /* Decorative divider */
    .divider {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 28px;
      width: 100%;
      max-width: 280px;
    }

    .divider-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--rose), transparent);
    }

    .divider-rose {
      font-size: 1.1rem;
      color: var(--rose-light);
      opacity: 0.85;
    }

    /* Links */
    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .link-btn {
      display: block;
      text-decoration: none;
      text-align: center;
      padding: 18px 22px;
      border-radius: 6px;
      position: relative;
      transition: all 0.3s ease;
      border: 1px solid transparent;
      background: var(--bg-card);
      color: var(--cream);
      font-family: 'Cinzel', serif;
      font-size: 1.05rem;
      letter-spacing: 0.06em;
      overflow: hidden;
    }

    /* Main course button */
    .link-btn.primary {
      background: linear-gradient(160deg, #2a1218 0%, #3d1822 50%, #2a1218 100%);
      border: 1px solid var(--rose);
      box-shadow: 
        0 0 0 1px rgba(201, 162, 39, 0.15),
        0 8px 24px rgba(92, 26, 42, 0.4),
        inset 0 1px 0 rgba(255,255,255,0.05);
    }

    .link-btn.primary:hover {
      transform: translateY(-2px);
      border-color: var(--rose-light);
      box-shadow: 
        0 0 0 1px rgba(201, 162, 39, 0.3),
        0 12px 32px rgba(139, 46, 63, 0.55),
        inset 0 1px 0 rgba(255,255,255,0.08);
    }

    .link-btn.secondary {
      background: rgba(22, 15, 18, 0.85);
      border: 1px solid rgba(139, 46, 63, 0.35);
    }

    .link-btn.secondary:hover {
      border-color: var(--rose);
      background: rgba(30, 18, 22, 0.95);
      transform: translateY(-1px);
    }

    .btn-title {
      display: block;
      font-weight: 600;
      margin-bottom: 3px;
    }

    .btn-sub {
      display: block;
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.95rem;
      letter-spacing: 0.02em;
      color: var(--gold-soft);
      opacity: 0.9;
      font-weight: 400;
    }

    .price-tag {
      display: inline-block;
      margin-top: 6px;
      padding: 3px 12px;
      background: rgba(201, 162, 39, 0.15);
      border: 1px solid rgba(201, 162, 39, 0.35);
      border-radius: 20px;
      font-size: 0.85rem;
      color: var(--gold);
      letter-spacing: 0.08em;
    }

    /* Social row */
    .socials {
      display: flex;
      gap: 18px;
      margin-top: 36px;
      justify-content: center;
    }

    .social-link {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid rgba(139, 46, 63, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      text-decoration: none;
      transition: all 0.25s ease;
      background: rgba(22, 15, 18, 0.6);
    }

    .social-link:hover {
      border-color: var(--gold);
      color: var(--gold);
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(201, 162, 39, 0.15);
    }

    .social-link svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    /* Footer */
    footer {
      margin-top: 48px;
      text-align: center;
      font-size: 0.85rem;
      color: rgba(196, 181, 176, 0.45);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-family: 'Cinzel', serif;
    }

    footer span {
      color: var(--rose);
      opacity: 0.7;
    }

    /* Responsive tweaks */
    @media (max-width: 480px) {
      h1 {
        font-size: 1.9rem;
        letter-spacing: 0.14em;
      }
      .tagline {
        font-size: 1.35rem;
      }
      .bio {
        font-size: 1.08rem;
      }
    }
  </style>
</head>
<body>

    <footer>

  </div>

</html>
