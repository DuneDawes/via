<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Via — Via Protocol</title>
  <meta name="description" content="Via Protocol by Via — Looks. Presence. Structure." />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: #000;
      color: #c8c4bc;
      font-family: 'Cinzel', serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(255,255,255,0.02) 0%, transparent 55%),
        radial-gradient(ellipse at 50% 100%, rgba(0,0,0,0.85) 0%, transparent 45%);
      pointer-events: none;
      z-index: 0;
    }

    /* side vine frames */
    .side-frame {
      position: fixed;
      top: 0;
      bottom: 0;
      width: 110px;
      z-index: 1;
      pointer-events: none;
      opacity: 0.7;
      overflow: hidden;
    }
    .side-frame.left { left: 0; }
    .side-frame.right { right: 0; transform: scaleX(-1); }

    .side-frame svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 400px;
      padding: 60px 24px 70px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .via {
      font-size: 0.78rem;
      letter-spacing: 0.7em;
      text-transform: uppercase;
      color: #9a958c;
      margin-bottom: 22px;
    }
    .via::before,
    .via::after {
      content: "•";
      opacity: 0.4;
      margin: 0 12px;
      letter-spacing: 0;
    }

    h1 {
      font-weight: 600;
      font-size: clamp(1.7rem, 6.8vw, 2.15rem);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      line-height: 1.12;
      color: #e8e4dc;
      text-shadow: 0 1px 0 #222, 0 2px 8px rgba(0,0,0,0.9);
      margin-bottom: 4px;
    }
    h1 span {
      display: block;
      font-size: 1.08em;
      letter-spacing: 0.1em;
    }

    .rule {
      width: 160px;
      height: 1px;
      background: linear-gradient(90deg, transparent, #5a554c, transparent);
      margin: 24px 0 14px;
      position: relative;
    }
    .rule::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 6px;
      height: 6px;
      border: 1px solid #5a554c;
      background: #000;
      transform: translate(-50%, -50%) rotate(45deg);
    }

    .pillars {
      font-size: 0.68rem;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: #6e6a62;
      margin-bottom: 42px;
    }

    .shield-wrap {
      margin-bottom: 42px;
      filter: drop-shadow(0 10px 24px rgba(0,0,0,0.7));
    }
    .shield {
      width: 84px;
      height: 100px;
      background: linear-gradient(165deg, #1a1816 0%, #0a0908 100%);
      border: 1.5px solid #4a463e;
      clip-path: polygon(50% 0%, 100% 12%, 100% 70%, 50% 100%, 0% 70%, 0% 12%);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .shield::before {
      content: "";
      position: absolute;
      inset: 5px;
      border: 1px solid rgba(90,85,75,0.35);
      clip-path: polygon(50% 0%, 100% 12%, 100% 70%, 50% 100%, 0% 70%, 0% 12%);
      pointer-events: none;
    }
    .shield-mark {
      font-size: 1.6rem;
      color: #8a857c;
      line-height: 1;
      font-weight: 600;
      letter-spacing: 0.05em;
    }

    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .btn {
      display: block;
      text-decoration: none;
      padding: 16px 18px;
      background: #0a0908;
      border: 1px solid #2c2a26;
      color: #c8c4bc;
      font-family: 'Cinzel', serif;
      letter-spacing: 0.1em;
      transition: border-color 0.2s, background 0.2s;
    }
    .btn.primary {
      border-color: #4a463e;
      background: linear-gradient(180deg, #141210, #0a0908);
    }
    .btn.primary:hover {
      border-color: #7a756c;
      background: #161412;
    }
    .btn.secondary:hover {
      border-color: #4a463e;
      background: #100e0c;
    }

    .btn-title {
      display: block;
      font-weight: 600;
      font-size: 0.9rem;
      color: #e8e4dc;
      margin-bottom: 2px;
    }
    .btn-sub {
      display: block;
      font-size: 0.68rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #6e6a62;
    }
    .price {
      display: inline-block;
      margin-top: 8px;
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      color: #9a958c;
      border: 1px solid #3a3832;
      padding: 2px 11px;
    }

    .socials {
      display: flex;
      gap: 12px;
      margin-top: 40px;
    }
    .social {
      width: 40px;
      height: 40px;
      border: 1px solid #2c2a26;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #6e6a62;
      text-decoration: none;
      background: #0a0908;
      transition: all 0.2s;
    }
    .social:hover {
      border-color: #4a463e;
      color: #c8c4bc;
    }
    .social svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    footer {
      margin-top: 50px;
      font-size: 0.62rem;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: #3a3832;
    }

    @media (max-width: 560px) {
      .side-frame { width: 55px; opacity: 0.45; }
    }
  </style>
