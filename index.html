<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Via — Aesthetic Blueprint</title>
  <meta name="description" content="Aesthetic Blueprint by Via — Looks. Presence. Structure." />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: #000;
      color: #d4d0c8;
      font-family: 'Cinzel', serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 0 60px;
      position: relative;
    }

    /* full-bleed dark vignette */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 50% 20%, rgba(40,10,15,0.45) 0%, transparent 60%),
        radial-gradient(ellipse at 50% 80%, rgba(0,0,0,0.85) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 50px 24px 0;
    }

    /* VIA */
    .via {
      font-size: 0.78rem;
      letter-spacing: 0.65em;
      text-transform: uppercase;
      color: #b0a99e;
      margin-bottom: 22px;
    }
    .via::before, .via::after {
      content: "•";
      opacity: 0.4;
      margin: 0 10px;
      letter-spacing: 0;
    }

    /* Main title - metallic feel */
    h1 {
      font-family: 'Cinzel', serif;
      font-weight: 600;
      font-size: clamp(1.7rem, 6.5vw, 2.15rem);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      text-align: center;
      line-height: 1.12;
      color: #e8e4dc;
      text-shadow:
        0 1px 0 #3a3530,
        0 2px 4px rgba(0,0,0,0.9),
        0 0 30px rgba(200,190,170,0.12);
      margin-bottom: 4px;
    }

    h1 span {
      display: block;
      font-size: 1.05em;
      letter-spacing: 0.1em;
    }

    /* thin ornamental line */
    .rule {
      width: 160px;
      height: 1px;
      background: linear-gradient(90deg, transparent, #6a635a, transparent);
      margin: 22px 0 14px;
      position: relative;
    }
    .rule::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%) rotate(45deg);
      width: 6px;
      height: 6px;
      border: 1px solid #6a635a;
      background: #000;
    }

    .pillars {
      font-size: 0.68rem;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: #7a736a;
      margin-bottom: 40px;
    }

    /* central rose emblem */
    .emblem {
      width: 86px;
      height: 100px;
      margin-bottom: 36px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .emblem-shield {
      width: 72px;
      height: 86px;
      background: linear-gradient(165deg, #1a1614 0%, #0a0808 100%);
      border: 1px solid #4a433c;
      clip-path: polygon(50% 0%, 100% 10%, 100% 68%, 50% 100%, 0% 68%, 0% 10%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        0 0 0 1px #000,
        0 10px 30px rgba(0,0,0,0.7),
        inset 0 1px 0 rgba(200,190,170,0.06);
    }

    .emblem-rose {
      font-size: 1.9rem;
      line-height: 1;
      filter: grayscale(0.15) contrast(1.1);
    }

    /* buttons */
    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .btn {
      display: block;
      text-decoration: none;
      text-align: center;
      padding: 16px 18px;
      background: #0c0a0a;
      border: 1px solid #2e2a26;
      color: #d4d0c8;
      transition: all 0.2s ease;
      font-family: 'Cinzel', serif;
      letter-spacing: 0.1em;
    }

    .btn.primary {
      border-color: #4a1e24;
      background: linear-gradient(180deg, #120c0e 0%, #0a0708 100%);
      box-shadow: 0 0 0 1px rgba(80,20,30,0.2);
    }

    .btn.primary:hover {
      border-color: #7a2e38;
      background: #140e10;
    }

    .btn.secondary:hover {
      border-color: #4a433c;
      background: #121010;
    }

    .btn-title {
      display: block;
      font-weight: 600;
      font-size: 0.9rem;
      color: #e8e4dc;
      margin-bottom: 2px;
    }

    .btn-sub {
      display: block;
      font-size: 0.72rem;
      letter-spacing: 0.18em;
      color: #7a736a;
      text-transform: uppercase;
    }

    .price {
      display: inline-block;
      margin-top: 8px;
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      color: #a05060;
      border: 1px solid #4a1e24;
      padding: 2px 10px;
    }

    /* socials */
    .socials {
      display: flex;
      gap: 12px;
      margin-top: 40px;
    }

    .social {
      width: 40px;
      height: 40px;
      border: 1px solid #2e2a26;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #7a736a;
      text-decoration: none;
      transition: all 0.2s ease;
      background: #0a0808;
    }

    .social:hover {
      border-color: #4a433c;
      color: #d4d0c8;
    }

    .social svg {
      width: 17px;
      height: 17px;
      fill: currentColor;
    }

    footer {
      margin-top: 50px;
      font-size: 0.65rem;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: #3a3530;
    }
  </style>
</head>
<body>

    <div class="via">VIA</div>

      <span>Blueprint</span>
